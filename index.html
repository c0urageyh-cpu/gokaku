<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --line:#3a2f3c; --chip:#2c2430;

  --ok:#6fdcbc; --ok-bg:#163229; --ng:#ff8fa3; --ng-bg:#3b1d24; --warn:#f3c56b; --warn-bg:#352a12;
  --gold:#ffcf5c; --gold-bg:#33280f; color-scheme:dark}}
:root[data-theme="dark"]{

  --line:#3a2f3c; --chip:#2c2430;
  --acc:#ff8fab; --acc2:#ffb38a; --acc-bg:#3a1f29; --on-acc:#1a1216;
  --ok:#6fdcbc; --ok-bg:#163229; --ng:#ff8fa3; --ng-bg:#3b1d24; --warn:#f3c56b; --warn-bg:#352a12;

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.wrap{max-width:520px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

h1,h2,h3{font-weight:700;text-wrap:balance}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.chipx b{font-family:var(--f-pop);font-weight:400;font-size:15px;color:var(--ink)}
.chipx.fire b{color:var(--ng)} .chipx.coin{background:var(--gold-bg);color:var(--gold)} .chipx.coin b{color:var(--gold)}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,var(--acc-bg),var(--card) 70%);border-color:transparent}

.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--chip) 0)}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;line-height:1;text-align:center}
.ring b{font-family:var(--f-pop);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.hline{font-size:15px;line-height:1.6;min-width:0}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub)}
.wd i{width:100%;max-width:36px;aspect-ratio:1;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mute);border:2px solid transparent}

.gr .rt.done{color:var(--ok)}

.gbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}

.unlock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}

.unlock p small{display:block;font-size:12px;color:var(--sub)}
.unitbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;text-align:left;width:100%}
.subj{display:flex;flex-direction:column;gap:8px}

.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.th .sw{width:100%;height:56px}
.th b{font-size:15px}
.th small{font-size:11px;color:var(--sub);line-height:1.4}
.th[aria-pressed="true"]{border:2px solid var(--acc)}
.th.lock{opacity:.55}

/* quiz */
.qtop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.close{min-height:40px;min-width:40px;padding:4px 10px;border-radius:999px;font-size:14px}
.story{display:flex;gap:4px}
.story i{flex:1;height:5px;border-radius:3px;background:var(--chip)}
.story i.on{background:var(--acc)} .story i.ok{background:var(--ok)} .story i.ng{background:var(--ng)}
.combo{font-family:var(--f-pop);font-size:13px;color:var(--acc);white-space:nowrap;min-width:3.5em;text-align:right}
.qcard{position:relative;display:flex;flex-direction:column;gap:14px;min-height:62vh;border-radius:24px;padding:20px 18px}
.qhead{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--sub);white-space:nowrap}
.tg.w{background:var(--acc-bg);color:var(--acc)}
.q{font-size:19px;line-height:1.85;font-weight:500}
.q u{text-decoration:none;border-bottom:3px solid var(--acc);font-weight:700;padding:0 1px}
.wnote{font-size:13px;color:var(--sub);background:var(--chip);border-radius:12px;padding:8px 12px}
.ox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ox button{font-family:var(--f-pop);font-size:36px;min-height:88px;border-radius:20px;line-height:1}
.mc{display:flex;flex-direction:column;gap:10px}
.mc button{text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;border-radius:16px;min-height:56px}
.mc button b{font-family:var(--f-pop);font-weight:400;color:var(--acc);text-align:center}
button.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
button.wrong{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.unk{background:transparent;border:0;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:40px;align-self:center}
.reveal{font-family:var(--f-pop);font-size:44px;text-align:center;letter-spacing:.08em;color:var(--acc)}
.react{border-radius:18px;padding:14px;text-align:center}
.react b{display:block;font-family:var(--f-pop);font-weight:400;font-size:26px;line-height:1.3}
.react span{font-size:14px;font-weight:700}
.react.good{background:var(--ok-bg);color:var(--ok)} .react.bad{background:var(--ng-bg);color:var(--ng)} .react.unk{background:var(--warn-bg);color:var(--warn)}
.coinpop{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--gold);background:var(--gold-bg);border-radius:999px;padding:2px 12px}
.ex{display:flex;flex-direction:column;gap:8px}
.ex div{border-radius:14px;padding:10px 12px;background:var(--chip)}
.ex small{display:block;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.ex p{font-size:15px}
.ex .tip{background:var(--acc-bg)} .ex .tip small,.ex .tip p{color:var(--acc)}
.ex .trap{background:var(--warn-bg)} .ex .trap small,.ex .trap p{color:var(--warn)}
.nextbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.swipe{font-size:11px;color:var(--mute);text-align:center;margin-top:4px}

/* result */
.res{display:flex;flex-direction:column;gap:14px;text-align:center}
.big{font-family:var(--f-pop);font-size:56px;line-height:1.1;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--chip);border-radius:14px;padding:8px}
.tile small{display:block;font-size:11px;color:var(--sub)}
.tile b{font-family:var(--f-pop);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.ups{display:flex;flex-direction:column;gap:8px;text-align:left}

.news{background:var(--gold-bg);color:var(--gold);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}

.cd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--chip);border-radius:12px;padding:4px;gap:4px}

.map{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 38px 40px;gap:4px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}

.mname{min-width:0;line-height:1.35}
.mname small{display:block;font-size:11px;color:var(--mute)}
.dots{display:flex;justify-content:center;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.dots.none{font-size:10px;color:var(--mute)}
.dim{opacity:.3}
.mpct{text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.save{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--chip);color:var(--sub)}

.code{width:100%;box-sizing:border-box;min-height:90px;font:inherit;font-size:12px;line-height:1.5;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.col{display:flex;flex-direction:column;gap:10px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabs button{border:0;background:transparent;min-height:48px;padding:4px 2px;font-size:12px;font-weight:700;color:var(--mute);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.tabs button i{width:22px;height:5px;border-radius:3px;background:transparent}
.tabs button[aria-current="page"]{color:var(--acc)}
.tabs button[aria-current="page"] i{background:var(--acc)}

/* motion */
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:24px}
.burst i{position:absolute;left:50%;top:40%;width:9px;height:9px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .in{animation:in .22s ease-out}
  @keyframes in{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
  .react{animation:boing .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes boing{from{transform:scale(.7)}to{transform:none}}
  .burst i{animation:fly .9s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
}
</style>

const KEY='gokaku-note-v1';
let st={};
/* 保存先：①claude.aiアカウント（ログイン中なら）②この端末のブラウザ ③どちらも無理なら引き継ぎコード */
let localOK=false;
try{localStorage.setItem(KEY+'-t','1');localOK=localStorage.getItem(KEY+'-t')==='1';localStorage.removeItem(KEY+'-t')}catch(e){localOK=false}
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function norm(){
if(!['all','d','r','s'].includes(st.school)) st.school='all';
st.res=st.res||{}; st.days=st.days||{}; st.dlog=st.dlog||{}; st.coins=st.coins||0; st.bragCoins=st.bragCoins||0;
st.mc=st.mc||{}; st.mastered=st.mastered||{}; st.wk=st.wk||{}; st.nego=st.nego||{}; st.t=st.t||0;
}
norm();
let cloud=null, cloudState='checking'; /* checking / on / off */
/* コインのルール：正解1枚（苦手単元は2枚）、1日のノルマ達成で10枚、ノルマ7日連続ごとに30枚 */
/* コインは「続ける」「苦手を克服する」ことにつく。量をこなしても増えない。
   正解コインはその日の最初の5問だけ・ノルマ達成10枚・7日連続20枚・苦手単元の正解率が初めて80%になったら20枚・月の上限600枚 */
st.mc=st.mc||{}; st.mastered=st.mastered||{}; st.wk=st.wk||{}; st.nego=st.nego||{};
/* 週間ノルマ＝月〜日のうち5日ノルマ達成で60枚（300円）、苦手克服60枚（300円）、月の上限600枚（3,000円）でアップ交渉権 */
const COIN={ok:1,okWeak:2,quota:10,week:60,master:60,monthCap:600};
const WEEK_DAYS=5;
function weekKeys(){const z=new Date(Date.now()+9*3600000);const dow=(z.getUTCDay()+6)%7;
  return [...Array(7)].map((_,n)=>new Date(z.getTime()+(n-dow)*86400000).toISOString().slice(0,10))}
const weekDone=()=>weekKeys().filter(k=>dayN(k)>=GOAL).length;
const monthKey=()=>todayKey().slice(0,7);
const monthLeft=()=>Math.max(0,COIN.monthCap-(st.mc[monthKey()]||0));
const total=()=>Object.values(st.days).reduce((a,b)=>a+b,0);
const level=()=>{const t=total();return {lv:Math.floor(t/50)+1,next:50-t%50}};
const YEN=5; /* コイン1枚＝5円 */
const yen=c=>(c*YEN).toLocaleString('ja-JP')+'円';
const GOAL=5;
const dkey=d=>{const z=new Date(d.getTime()+9*3600000);return z.toISOString().slice(0,10)}; /* 日本時間の日付 */
const todayKey=()=>dkey(new Date());
function dayN(k){return st.days[k]||0}
function streak(){let n=0;const d=new Date();if(dayN(dkey(d))<GOAL)d.setDate(d.getDate()-1);
  while(dayN(dkey(d))>=GOAL){n++;d.setDate(d.getDate()-1)}return n}
function lastGap(){const keys=Object.keys(st.days).filter(k=>st.days[k]>0).sort();if(!keys.length)return null;
  return Math.round((new Date(todayKey())-new Date(keys[keys.length-1]))/86400000)}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const OK_MSG=['正解！ 天才か？','正解！ そのまま本番もよろしく','正解！ 今日のあなた、冴えてる','正解！ 合格に1歩近づいた','正解！ これは先生もびっくり'];
const NG_MSG=['おしい！ ここで覚えたら本番は勝ち','まちがえた問題は、ただの伸びしろ','ドンマイ。まちがえるのは今のうちに'];
/* 問題IDは内容から作る（問題を追加しても記録がずれない） */
const qid=i=>{const s=Q[i][0]+Q[i][1];let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'h'+(h>>>0).toString(36)};
let cloudTimer=null, cloudBusy=false, cloudAgain=false;
function save(){
  st.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  if(cloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,800)}
}
async function pushCloud(){
  if(!cloud)return; if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;
  try{await cloud.set({json:JSON.stringify(st),t:st.t})}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){cloud=null;cloudState='off';refreshBadge()}}
  cloudBusy=false; if(cloudAgain){cloudAgain=false;pushCloud()}
}
/* アカウント保存の準備：ログインしていて書きこめるときだけ使う */
(async()=>{
  try{
    const C=window.claude; if(!C||!C.use){cloudState='off';refreshBadge();return}
    const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){cloudState='off';refreshBadge();return}
    const ref=db.doc('data/users/'+uid+'/state');
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data();let remote=null;try{remote=JSON.parse(d.json)}catch(e){}
      if(remote&&(remote.t||0)>(st.t||0)){st=remote;norm();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
    }
    cloud=ref;
    await ref.set({json:JSON.stringify(st),t:st.t||0});
    cloudState='on';
    if(!session) render(); else refreshBadge();
  }catch(e){cloud=null;cloudState='off';refreshBadge()}
})();
function badgeHTML(){
  if(cloudState==='on') return '<span class="save ok">記録はアカウントに保存中</span>';
  if(cloudState==='checking') return '<span class="save">保存先を確認中…</span>';
  if(localOK) return '<span class="save ok">記録はこのスマホに保存中</span>';
  return '<span class="save ng">この開き方だと記録が残りません</span>';
}
/* 引き継ぎコード：記録を文字にして、別の開き方・別の端末に移す */
function encodeState(){return btoa(unescape(encodeURIComponent(JSON.stringify(st))))}
function decodeState(s){return JSON.parse(decodeURIComponent(escape(atob(s.replace(/\s+/g,'')))))}
const app=document.getElementById('app');
let session=null;
const U=id=>UNITS.find(u=>u.id===id);
function freq(u,k){return k==='s'?u.sei:u[k]}
function days(d){return Math.max(0,Math.ceil((d-new Date())/86400000))}
function unitQs(u){return Q.map((q,i)=>({q,i})).filter(o=>o.q[0]===u)}
function pct(u){const qs=unitQs(u);const ok=qs.filter(o=>st.res[qid(o.i)]==='ok').length;const tried=qs.filter(o=>st.res[qid(o.i)]).length;return {ok,n:qs.length,tried,p:Math.round(ok/qs.length*100)}}
function prio(u){return st.school==='all'?Math.max(u.d,u.r,u.sei):freq(u,st.school)}
function weakList(){return Q.map((q,i)=>i).filter(i=>{const r=st.res[qid(i)];return r==='ng'||r==='unk'})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qtext(s){return esc(s).replace(/&lt;u&gt;(.*?)&lt;\/u&gt;/g,'<u>$1</u>')}
function dots(n,k,dim){if(!n)return `<div class="dots none${dim?' dim':''}">―</div>`;return `<div class="dots ${k}${dim?' dim':''}">${[1,2,3].map(x=>`<i class="${x<=n?'on':''}"></i>`).join('')}</div>`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(pool,n){ /* まちがい・未回答を優先 */
  const score=i=>{const r=st.res[qid(i)];return r==='ng'||r==='unk'?0:!r?1:2};
  return shuffle(pool).sort((a,b)=>score(a)-score(b)).slice(0,n);
}

function quotaDays(){return Object.values(st.days).filter(n=>n>=GOAL).length}

function pickToday(){
  const wk=pick(weakList(),2);
  const growPool=Q.map((q,i)=>i).filter(i=>U(Q[i][0]).pre&&!wk.includes(i));
  const a=pick(growPool,2);
  const rest=Q.map((q,i)=>i).filter(i=>prio(U(Q[i][0]))===3&&!wk.includes(i)&&!a.includes(i));
  return shuffle([...wk,...a,...pick(rest,GOAL-wk.length-a.length)]);
}

  <section class="card col in">
    <div class="sec"><h2>保存</h2><span id="save-badge"></span></div>
    <p class="note">記録が消えるときは「記録をコードにする」で保存しておくと、あとで元にもどせます。</p>
    <textarea id="code-out" class="code" readonly>${encodeState()}</textarea>
    <button id="b-codecopy">記録をコードにしてコピー</button>
    <label for="code-in" class="note">保存したコードからもどす</label>
    <textarea id="code-in" class="code"></textarea>
    <button id="b-codeload">この記録にもどす</button>
    <p class="note" id="code-msg"></p>
  </section>
  <section class="card col in">
    <div class="sec"><h2>本番まで</h2></div>
    <div class="cd">${EXAMS.map(e=>`<div class="cdi"><small>${e.name}</small><b>${days(e.date)}日</b><em>${e.label}</em></div>`).join('')}</div>
  </section>
  <section class="card col in">
    <div class="sec"><h2>ようす</h2><span>直近7日</span></div>
    <dl class="kv">
      <dt>解いた問題</dt><dd>${total()}問（いま正解 ${okN}/${answered}）</dd>
      <dt>ノルマ達成</dt><dd>${quotaDays()}日・連続 ${streak()}日</dd>
      <dt>コイン</dt><dd>${st.coins}枚＝${yen(st.coins)}（今月 ${(st.mc[monthKey()]||0)}/${COIN.monthCap}枚）</dd>
      <dt>まちがい多め</dt><dd>${esc(missTop)}</dd>
      <dt>克服</dt><dd>${GROW().filter(u=>growInfo(u).done).map(u=>u.name).join('、')||'まだなし'}</dd>
    </dl>
    ${st.nego[monthKey()]?'<p class="news">今月の上限に到達：お小遣いアップ交渉権あり</p>':''}
    <p class="note">コイン1枚＝5円。正解はその日の最初の5問だけ（伸びしろ単元は2枚）、ノルマ達成10枚、週5日達成で60枚（300円）、単元克服60枚（300円）、月の上限600枚（3,000円）。</p>
  </section>
  <div class="seg" role="group" aria-label="志望校で並べかえ">${[['all','全部'],['d','同志社国際'],['r','立命館宇治'],['s','聖母学院']].map(([k,l])=>`<button id="seg-${k}" aria-pressed="${st.school===k}" data-s="${k}">${l}</button>`).join('')}</div>
  <section class="card in">
    <div class="sec"><h2>出題マップ</h2><span>${st.school==='all'?'よく出る順':SCH[st.school]+'でよく出る順'}</span></div>
    <div class="map">
      <div class="mrow head"><span>単元</span><span>同志社<br>国際</span><span>立命館<br>宇治</span><span>聖母<br>学院</span><span style="text-align:right">正解</span></div>
      ${units.map(u=>{const p=pct(u.id);const on=k=>st.school!=='all'&&st.school!==k;return `<div class="mrow"><div class="mname">${u.name}<small>${u.s}${u.preL?'・'+u.preL:''}</small></div>${dots(u.d,'d',on('d'))}${dots(u.r,'r',on('r'))}${dots(u.sei,'s',on('s'))}<div class="mpct">${p.p}%</div></div>`}).join('')}
    </div>
    <p class="note" style="margin-top:6px">●●●よく出る　●●○出る範囲　―2科型では出ない。塾の傾向分析とプレテストの配点をもとにした目安です。</p>
  </section>
  <button id="b-reset" class="note">記録をリセット</button>`;
  refreshBadge();
  wrapEl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.school=b.dataset.s;save();render()});
  const out=document.getElementById('code-out'), msg=document.getElementById('code-msg');
  document.getElementById('b-codecopy').onclick=e=>{
    const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(out.value):Promise.reject();
    p.then(()=>{e.target.textContent='コピーしたよ'}).catch(()=>{out.focus();out.select();e.target.textContent='選んだので長押しでコピー'})};
  document.getElementById('b-codeload').onclick=()=>{
    try{const s=decodeState(document.getElementById('code-in').value);if(!s||typeof s!=='object'||!s.res)throw 0;
      st=s;norm();save();msg.textContent='もどしました。';msg.style.color='var(--ok)'}
    catch(e){msg.textContent='コードが読めませんでした。全部コピーできているか確かめてください。';msg.style.color='var(--ng)'}
  };
  const rs=document.getElementById('b-reset');
  rs.onclick=()=>{if(rs.dataset.c){st.res={};save();render()}else{rs.dataset.c=1;rs.textContent='もう一度押すとリセットします'}};
}
function refreshBadge(){const b=document.getElementById('save-badge');if(b)b.innerHTML=badgeHTML()}

/* ===== 問題（ショート風） ===== */
function start(list,title){
  if(!list.length)return;
  const before={};UNITS.forEach(u=>before[u.id]=pct(u.id).ok);
  session={list,title,pos:0,coins:0,tally:{ok:0,ng:0,unk:0},marks:[],combo:0,best:0,before,news:[]};
  show();
}
function burst(el){
  const b=document.createElement('div');b.className='burst';
  const cols=['var(--acc)','var(--acc2)','var(--gold)','var(--ok)'];
  for(let n=0;n<18;n++){const i=document.createElement('i');const a=Math.random()*Math.PI*2,d=80+Math.random()*120;
    i.style.background=cols[n%4];i.style.setProperty('--x',Math.cos(a)*d+'px');i.style.setProperty('--y',Math.sin(a)*d-40+'px');i.style.setProperty('--r',(Math.random()*540)+'deg');b.appendChild(i)}
  el.appendChild(b);setTimeout(()=>b.remove(),1000);
}
function show(){
  const s=session; if(s.pos>=s.list.length) return finish();
  tabsEl.hidden=true; wrapEl.className='wrap quiz';
  const i=s.list[s.pos], q=Q[i], u=U(q[0]);
  const type=q[3]===null?'ox':q[3]==='w'?'w':'mc';
  const order=type==='mc'?shuffle([0,1,2,3]):null;
  const bars=s.list.map((_,n)=>`<i class="${n<s.pos?(s.marks[n]==='ok'?'ok':'ng'):n===s.pos?'on':''}"></i>`).join('');
  wrapEl.innerHTML=`
  <div class="qtop"><button class="close" id="b-back" aria-label="やめる">✕</button><div class="story">${bars}</div><span class="combo">${s.combo>=2?s.combo+'連続！':''}</span></div>
  <article class="card qcard in" id="qc">
    <div class="qhead"><span class="tg">${u.s}・${u.name}</span>${u.pre?'<span class="tg w">伸びしろ</span>':''}<span class="tg">${type==='ox'?'○×':type==='w'?'書き取り':'4択'}</span></div>
    ${type==='w'?'<p class="wnote">線のカタカナを紙に漢字で書いてから「答えを見る」</p>':''}
    <p class="q">${qtext(q[1])}</p>
    ${type==='ox'?`<div class="ox"><button id="a-o" data-v="1">○</button><button id="a-x" data-v="0">×</button></div>`
     :type==='mc'?`<div class="mc">${order.map((c,n)=>`<button id="a-${n}" data-v="${c}"><b>${'アイウエ'[n]}</b><span>${esc(q[3][c])}</span></button>`).join('')}</div>`
     :`<button class="go" id="b-reveal">答えを見る</button>`}
    ${type!=='w'?'<button class="unk" id="b-unk">わからない</button>':''}
    <div id="fb" class="col"></div>
  </article>`;
  document.getElementById('b-back').onclick=()=>{if(s.pos>0&&s.tally.ok+s.tally.ng+s.tally.unk>0)finish();else render()};
  const qc=document.getElementById('qc'), fb=document.getElementById('fb');
  const extras=()=>`<div class="ex"><div><small>かいせつ</small><p>${esc(q[4])}</p></div>
      ${q[5]?`<div class="tip"><small>${type==='w'?'形のポイント':'覚え方'}</small><p>${esc(q[5])}</p></div>`:''}
      ${q[6]?`<div class="trap"><small>ひっかけ注意</small><p>${esc(q[6])}</p></div>`:''}</div>`;
  let coinNote='';
  const record=r=>{
    st.res[qid(i)]=r;const k=todayKey();const before=dayN(k);st.days[k]=before+1;
    const L=st.dlog[k]||(st.dlog[k]={ok:0,miss:{}});
    let c=0;const notes=[];
    const inQuota=before<GOAL;
    if(r==='ok'){L.ok++;if(inQuota){c+=u.pre?COIN.okWeak:COIN.ok}}
    else L.miss[u.id]=(L.miss[u.id]||0)+1;
    if(inQuota&&before+1>=GOAL){c+=COIN.quota;notes.push(`今日のノルマ達成 +${COIN.quota}`);
      const wk=weekKeys()[0];if(!st.wk[wk]&&weekDone()>=WEEK_DAYS){st.wk[wk]=1;c+=COIN.week;notes.push(`週間ノルマ達成 +${COIN.week}（300円）`);s.news.push('週間ノルマ達成！ 300円ゲット')}}
    if(u.pre&&!st.mastered[u.id]&&pct(u.id).p>=80){st.mastered[u.id]=1;c+=COIN.master;notes.push(`「${u.name}」克服 +${COIN.master}（300円）`);s.news.push(`「${u.name}」を克服！ 300円ゲット`)}
    const left=monthLeft();if(c>0&&c>=left){c=left;if(!st.nego[monthKey()]){st.nego[monthKey()]=1;s.news.push('今月の上限に到達！ お小遣いアップ交渉権ゲット')}}
    st.mc[monthKey()]=(st.mc[monthKey()]||0)+c;
    st.best=Math.max(st.best||0,streak());
    st.coins+=c;s.coins+=c;s.marks[s.pos]=r;s.tally[r]++;
    if(r==='ok'){s.combo++;s.best=Math.max(s.best,s.combo)}else s.combo=0;
    save();
    coinNote=(c?`<span class="coinpop">+${c}コイン</span>`:'')+(notes.length?`<span class="coinpop">${notes.join('　')}</span>`:'');
  };
  const reaction=(kind,ans)=>{
    const good=kind==='good';
    const head=good?(s.combo>=3?`${s.combo}連続正解！`:rnd(['正解！','天才か？','さすが！','ナイス！','それな！'])):kind==='unk'?'ここで覚えよう':rnd(['おしい！','ドンマイ！','伸びしろ発見！']);
    return `<div class="react ${kind}"><b>${head}</b>${ans?`<span>答え：${esc(ans)}</span>`:''}<div>${coinNote}</div></div>`;
  };
  const nextBtn=()=>{
    fb.insertAdjacentHTML('beforeend',`<div class="nextbar"><button class="go" id="b-next">${s.pos+1<s.list.length?'次へ':'結果を見る'}</button><p class="swipe">上にスワイプでも次へ</p></div>`);
    const go=()=>{s.pos++;show()};
    document.getElementById('b-next').onclick=go;
    let y0=null;qc.ontouchstart=e=>{y0=e.touches[0].clientY};qc.ontouchend=e=>{if(y0!==null&&y0-e.changedTouches[0].clientY>90&&window.innerHeight+window.scrollY>=document.body.scrollHeight-40)go();y0=null};
  };
  if(type==='w'){
    document.getElementById('b-reveal').onclick=e=>{
      e.target.hidden=true;
      fb.innerHTML=`<div class="reveal">${esc(q[2])}</div><div class="ox"><button id="w-ok" style="font-family:var(--f-body);font-size:16px;font-weight:700">書けた！</button><button id="w-ng" style="font-family:var(--f-body);font-size:16px">書けなかった</button></div>`;
      const ok=document.getElementById('w-ok'),ng=document.getElementById('w-ng');
      const done=good=>{ok.disabled=ng.disabled=true;(good?ok:ng).classList.add(good?'right':'wrong');record(good?'ok':'ng');
        fb.insertAdjacentHTML('beforeend',reaction(good?'good':'bad','')+extras());if(good)burst(qc);nextBtn()};
      ok.onclick=()=>done(true); ng.onclick=()=>done(false);
    };
    window.scrollTo(0,0); return;
  }
  const btns=[...wrapEl.querySelectorAll('[data-v]')];
  const judge=(v,unk)=>{
    btns.forEach(b=>b.disabled=true); document.getElementById('b-unk').hidden=true;
    const correctV=type==='ox'?(q[2]?'1':'0'):String(q[2]);
    const good=!unk&&v===correctV;
    btns.forEach(b=>{if(b.dataset.v===correctV)b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong')});
    record(unk?'unk':good?'ok':'ng');
    const ans=type==='ox'?(q[2]?'○':'×'):q[3][q[2]];
    fb.innerHTML=reaction(good?'good':unk?'unk':'bad',good?'':ans)+extras();
    if(good)burst(qc);
    nextBtn();
    fb.firstElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  btns.forEach(b=>b.onclick=()=>judge(b.dataset.v,false));
  document.getElementById('b-unk').onclick=()=>judge(null,true);
  window.scrollTo(0,0);
}
function finish(){
  const s=session, t=s.tally, n=t.ok+t.ng+t.unk;
  const tn=dayN(todayKey());
  const ups=UNITS.map(u=>({u,b:s.before[u.id],a:pct(u.id).ok,n:pct(u.id).n})).filter(x=>x.a>x.b);
  const head=n&&t.ok===n?'パーフェクト！':t.ok>=Math.ceil(n*0.8)?'いい感じ！':t.ok>0?'伸びてる！':'ここからが伸びしろ';
  tabsEl.hidden=true; wrapEl.className='wrap quiz';
  wrapEl.innerHTML=`<section class="card res in" id="rc">
    <p class="note">${esc(s.title)}</p>
    <div class="big">${t.ok}<span style="font-size:24px"> / ${n}</span></div>
    <h2 class="pop-t" style="font-weight:400;font-size:22px">${head}</h2>
    <div class="tiles"><div class="tile"><small>コイン</small><b>+${s.coins}</b></div><div class="tile"><small>最高れんぞく</small><b>${s.best}</b></div><div class="tile"><small>今日</small><b>${tn}問</b></div></div>
    ${s.news.map(x=>`<p class="news">${esc(x)}</p>`).join('')}
    ${ups.length?`<div class="ups">${ups.map(x=>`<div class="up"><span>${x.u.name}</span><span>${x.b}→${x.a}問正解</span></div>`).join('')}</div>`:''}
    <p class="note">${tn>=GOAL?'今日のノルマ達成。ここからは修行レベルが上がるよ':`あと${GOAL-tn}問で今日のノルマ達成`}</p>
    ${t.ng+t.unk?'<button class="ghost" id="b-retry">まちがえた問題だけもう一度</button>':''}
    <button class="go" id="b-more">${tn>=GOAL?'もう5問いく':'つづけて5問'}</button>
    <button id="b-home">ホームへ</button></section>`;
  if(t.ok===n&&n)burst(document.getElementById('rc'));
  const miss=s.list.filter((_,k)=>s.marks[k]&&s.marks[k]!=='ok');
  const rb=document.getElementById('b-retry'); if(rb) rb.onclick=()=>start(shuffle(miss),'もう一度');
  document.getElementById('b-more').onclick=()=>start(pickToday(),'今日の5問');
  document.getElementById('b-home').onclick=home;
}
applyTheme();
render();
</script>

</body></html>
